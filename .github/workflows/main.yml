name: Codzienna Aktualizacja Bazy KM

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizuj-baze:
    runs-on: ubuntu-latest

    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4 # Zaktualizowana wersja

      - name: Konfiguracja języka Python
        uses: actions/setup-python@v5 # Zaktualizowana wersja
        with:
          python-version: '3.10'

      - name: Instalacja potrzebnych bibliotek
        run: |
          pip install -r requirements.txt

      - name: Uruchomienie Twojego skryptu
        run: |
          python skrypt.py

      - name: Zapisanie i wypchnięcie nowego JSON-a
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Sprawdzamy, czy plik powstał. Jeśli tak, zapisujemy.
          if [ -f train_models.json ]; then
            git add train_models.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja modeli KM" && git pull --rebase origin main && git push)
          else
            echo "Skrypt nie wygenerował pliku train_models.json!"
            exit 1
          fi
