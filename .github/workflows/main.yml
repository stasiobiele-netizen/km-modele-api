name: Codzienna Aktualizacja Bazy KM

on:
  schedule:
    - cron: '0 3 * * *' # Automatyczne uruchomienie o 3:00 w nocy
  workflow_dispatch:    # Przycisk do ręcznego uruchamiania

permissions:
  contents: write       # Uprawnienia do zapisu w repozytorium

jobs:
  aktualizuj-baze:
    runs-on: ubuntu-latest

    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # POBIERA PEŁNĄ HISTORIĘ - kluczowe dla uniknięcia błędów przy ręcznym starcie!

      - name: Konfiguracja języka Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja potrzebnych bibliotek
        run: |
          pip install -r requirements.txt

      - name: Uruchomienie Twojego skryptu
        run: |
          python skrypt.py

      - name: Zapisanie i bezpieczne wypchnięcie do repozytorium
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Dodajemy plik, jeśli skrypt go wygenerował
          git add train_models.json
          
          # Sprawdzamy, czy w ogóle nastąpiła jakakolwiek zmiana
          if git diff --staged --quiet; then
            echo "Dane są identyczne jak wczoraj. Nie ma potrzeby nadpisywania pliku."
          else
            echo "Wykryto nową wersję rozkładu! Zapisuję..."
            git commit -m "Automatyczna aktualizacja modeli KM"
            
            # MAGIA BEZPIECZEŃSTWA: Pobieramy to co jest na serwerze, zanim wrzucimy nowe
            git pull --rebase origin main
            
            # Ostateczne wypchnięcie pliku do chmury
            git push
          fi
