name: Automatyczna Aktualizacja Rozkładu KM

on:
  schedule:
    # Uruchamia się o 3:00 czasu polskiego (1:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Ta linijka dodaje magiczny przycisk "Run workflow", żebyś mógł to odpalić ręcznie do testów!

jobs:
  aktualizuj-baze:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v3

      - name: Instalacja środowiska Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja wymaganych bibliotek
        run: pip install pdfplumber requests beautifulsoup4

      - name: Uruchomienie skryptu (Ekstrakcja z PDF)
        # UWAGA: Upewnij się, że nazwa pliku poniżej to nazwa Twojego skryptu w Pythonie!
        run: python skrypt.py 

      - name: Zapisanie nowego pliku JSON do repozytorium
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-aktualizacja bazy modeli KM"
          file_pattern: train_models.json
